name: Testar servidor e gerar modpack

# Testa a lista de mods num servidor temporario (alguns minutos) e publica o modpack
# para os jogadores. O servidor de verdade roda na maquina da Oracle, nao aqui.
on:
  push:
    paths: [mods.txt, config.env, server.properties, scripts/**, .github/workflows/testar.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Conferir mods no Modrinth
        run: python3 scripts/mods.py verificar

      - name: Baixar Fabric e mods
        run: python3 scripts/mods.py servidor teste

      - name: Ligar o servidor e esperar ficar pronto
        working-directory: teste
        run: |
          cp ../server.properties .
          echo "eula=true" > eula.txt
          java -Xmx2G -jar fabric-server-launch.jar nogui > log.txt 2>&1 &
          for i in $(seq 1 120); do
            grep -q "Done (" log.txt && break
            if ! kill -0 $! 2>/dev/null; then cat log.txt; exit 1; fi
            sleep 5
          done
          grep -q "Done (" log.txt || { cat log.txt; exit 1; }
          echo "--- Mods carregados ---"
          sed -n '/Loading [0-9]* mods/,/^\[/p' log.txt | head -40

      - name: Conferir se o servidor responde
        run: python3 scripts/ping.py localhost 25565

      - name: Conferir se os mods da lista carregaram
        run: |
          for arquivo in teste/mods/*.jar; do
            id=$(unzip -p "$arquivo" fabric.mod.json | python3 -c 'import json,sys; print(json.load(sys.stdin, strict=False)["id"])')
            grep -q -- "- $id " teste/log.txt && echo "carregou: $id" || { echo "NAO carregou: $id"; exit 1; }
          done

      - name: Desligar o servidor
        if: always()
        run: pkill -f fabric-server-launch.jar || true

      - name: Gerar modpack
        run: VERSAO_MODPACK="${GITHUB_SHA::7}" python3 scripts/mods.py modpack modpack.mrpack

      - uses: actions/upload-artifact@v5
        with:
          name: modpack
          path: modpack.mrpack

      - name: Publicar modpack para os jogadores
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete modpack --yes --cleanup-tag || true
          gh release create modpack modpack.mrpack --latest \
            --title "Modpack do servidor" \
            --notes "Importe este arquivo no Modrinth App (ou Prism Launcher) para jogar no servidor com os mesmos mods."

  # Roda o instalador de verdade numa maquina Ubuntu limpa, como na Oracle.
  instalador:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Rodar instalar.sh
        run: |
          sudo RAMO="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git" \
            bash scripts/instalar.sh
      - name: Esperar o servidor ficar pronto e responder
        run: |
          for i in $(seq 1 60); do
            sudo journalctl -u minecraft --no-pager | grep -q "Done (" && break
            sleep 5
          done
          sudo journalctl -u minecraft --no-pager | tail -20
          python3 scripts/ping.py localhost 25565
